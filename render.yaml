services:
  - type: web
    name: stock-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend5:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: ${{ secrets.DATABASE_URL }}
      - key: PYTHONUNBUFFERED
        value: 'true'
    
  - type: static
    name: stock-ai-frontend
    staticPublicPath: dist
    buildCommand: npm install && npm run build
    routes:
      - path: /api/*
        destination: stock-ai-backend
      - path: /*
        destination: /index.html
